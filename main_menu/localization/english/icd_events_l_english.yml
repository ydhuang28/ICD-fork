 icd_reformation_push.2.title: "Identity of the Order"
 icd_reformation_push.2.entry: "Identity of the Order"
 icd_reformation_push.2.desc: "The spread of [ShowReligionName('lutheran')] across Germany has raised questions regarding the future of our Order. No longer surrounded by pagans that need to be converted, our role in Catholicism has been questioned even by our own knights. In order to retain control and authority over our territory, perhaps a break with our past might be necessary. [GetCharacter('martin_luther').GetName] has recently advised [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName] that a wise solution would be to convert to [ShowReligionName('lutheran')] and to secularise our state into a monarchy. This would put our relationship with [GetCountry('LIV').GetName] at risk, however."
 icd_reformation_push.2.a: "We will be an Order no longer!"
 icd_reformation_push.2.b: "A ridiculous proposition"
 icd_livonians_will_decide: "[GetCountry('LIV').GetName] will have to decide what to do"
 icd_reformation_push.3.title: "Teutonic Secularisation"
 icd_reformation_push.3.desc: "News has reached us that the Teutons have become the state of [GetCountry('PRU').GetName], after having decided to secularise and convert to [ShowReligionName('lutheran')]. This puts us in a conundrum, as we face similar questions regarding our continued existence as a military order without heathen neighbours to convert. We should decide whether to follow a similar path to them, or to retain our roots and permanently sever our relationship. Choosing the latter might put us at risk, squashed between hostile neighbours"
 icd_reformation_push.3.a: "We will be an Order no longer!"
 icd_reformation_push.3.b: "We are Catholic, first and foremost"
 icd_reformation_push.3.c: "We will be an Order no longer but the Teutons have no say in our future"
 icd_reformation_push.4.title: "Secularisation"
 icd_reformation_push.4.desc: "Our conversion to Protestantism has proven somewhat incompatible with our nature as a theocracy. Without the institutions and legitimacy provided by the Catholic Church, it might be better to secularise our territories and adopt a more definite monarchical organization." 
 icd_reformation_push.4.a: "Secularise now!"
 icd_reformation_push.4.b: "We will be a Protestant theocracy"
 icd_reformation_push.5.entry: "Surrounded by Protestants"
 icd_reformation_push.5.title: "Surrounded by Protestants"
 icd_reformation_push.5.desc: "The conversion away from [ShowReligionName('catholic')] by [GetCountry('DEN').GetName] and [GetCountry('SWE').GetName] has proven to have been quite successful. It is perhaps in our interest to follow suit and adopt a new faith."
 icd_reformation_push.5.a: "Embrace [ShowReligionName('lutheran')]"
 icd_reformation_push.5.b: "Embrace [ShowReligionName('calvinist')]"
 icd_reformation_push.5.c: "We are not interested"
 icd_reformation_push.6.entry: "The Confessor"
 icd_reformation_push.6.title: "The Confessor"
 icd_reformation_push.6.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] has great fondness for the now Protestant city of [ShowLocationName('wittenberg')] after having visited there in earlier years and personally knows many acquaintances of [GetCharacter('martin_luther').GetName] from there. Perhaps due to this, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has proven somewhat sympathetic to [ShowReligionName('lutheran')] and has shown an interest in adopting it as a state religion."
 icd_the_confessor: "the Confessor"
 icd_reformation_push.6.b: "Not interested"
 icd_reformation_push.7.title: "Zeal Dies Down"
 icd_reformation_push.7.desc: "The initial turmoil and chaos caused by the [ShowSituationName('reformation')] has died down. The novelty of the new Christian denominations has worn out.\n\nPreviously, the zeal of the [ShowSituationName('reformation')] had made attempts at converting people by our state impossible. This has now changed. Our missionaries have encountered greater success in converting peoples to our faith, and with the success of both the Counter-Reformation and the Protestant State Churches, ensuring religious homogeneity has become easier."
 icd_reformation_push_tt: "We will receive a boost to the [forced_conversion|e] of [heretics|e] for 100 years."
 icd_reformation_push.7.a: "Great"
 icd_reformed.1.title: "Andreas Karlstadt"
 icd_reformed.1.desc: "One of [GetCharacter('martin_luther').GetName]'s most astute allies has proven to be [GetCharacter('icd_reformer_andreas_karlstadt').GetName]. A respected theologian in his own right, Andreas has begun promoting the Reformation against what he sees as a corrupt Church."
 icd_reformed.3.title: "Severed Ties"
 icd_reformed.3.desc: "Despite having defended [GetCharacter('martin_luther').GetName] in the Leipzig Debate and afterwards, [GetCharacter('icd_reformer_andreas_karlstadt').GetName] has unequivocally broken with [GetCharacter('martin_luther').GetName] and adopted a more radical theology. Andreas has begun to ask to be called 'Brother Andreas', refuses to use anything other than peasant clothing, calls for iconoclasm and has begun promoting positions more aligned with the [ShowReligionAdjective('calvinist')] tradition and the Zwickau Prophets."
 icd_reformed.3.a: "Good for him"
 icd_reformed.3.b: "Has he heard about [ShowReligionName('anabaptist')]?"
 icd_reformed.5.title: "Preachers of Strassburg"
 icd_reformed.5.desc: "Our city of [ShowLocationName('strasbourg')] has stood out in recent weeks as a city where a large number of Protestant preachers have begun to operate. Belonging to various different theological traditions, two stand out for their relevance. [GetCharacter('icd_matthaus_zell').GetName] is a proponent of [ShowReligionName('lutheran')] and, after his recent marriage, his wife has become the first citizen of [ShowLocationName('strasbourg')] to marry a priest. [GetCharacter('icd_martin_bucer').GetName] has played an important role as a mediator between [ShowReligionName('lutheran')] and [ShowReligionName('calvinist')], though he leans more towards [ShowReligionAdjective('calvinist')] theology."
 icd_reformed.5.a: "Interesting"
 icd_reformed.8.title: "Reception to Protestantism"
 icd_reformed.8.desc: "Since [GetCharacter(icd_caspar_schwenckfeld).GetName] began preaching in our territory, he has been very successful in spreading the [ShowReligionAdjective('lutheran')] faith. Recently, his preaching has reached even our court, with many being increasingly sympathetic to [ShowReligionName('lutheran')]."
 icd_reformed.8.a: "Perhaps we should embrace [ShowReligionName('lutheran')]."
 icd_reformed.8.b: "This is not of interest to us"
 
 icd_munster_radicals_gather_tt: "Some [pops|e] will become [ShowReligionAdjective('anabaptist')] radicals."
 icd_munster_radicals_gather_more_tt: "Many [pops|e] will become [ShowReligionAdjective('anabaptist')] radicals."
 
 icd_reformation_push.8.title: "Novel Rejections of Catholicism"
 icd_reformation_push.8.desc: "The outbreak of the [ShowSituationName('reformation')] has brought about new rejections of [ShowReligionName('catholic')] that have broken away from the institution, as we once did. These new religions bring new insights into the world. We could allow them to spread in our territory, or we could openly reject and oppose any attempts at changing our existing faith."
 icd_reformation_push.8.a: "We want nothing to do with them"
 icd_reformation_push.8.b: "Let's see what they have to say"
 icd_reformation_push.9.title: "Calvin's Influence"
 icd_reformation_push.9.desc: "[GetCharacter('john_calvin').GetName] has proven to be quite skilled at gathering support among our people. He has succeeded in convincing the government to pass the Ordonnances ecclésiastiques, defining ministerial functions, and has begun to lobby changes to the Civil Edicts. Together, these acts would effectively transform our state into a [ShowReligionAdjective('calvinist')] nation.\n\nOpposing him, a group of individuals from wealthy and powerful families calling themselves the Spirituels, have also began to try to wrestle authority in their favour, with the end goal of exiling [GetCharacter('john_calvin').GetName] if possible."
 icd_reformation_push.9.a: "[GetCharacter('john_calvin').GetName] triumphs against the opposition"
 icd_reformation_push.9.b: "[GetCharacter('john_calvin').GetName] gets exiled"
 icd_reformation_push.9.c: "It is a stalemate"
 icd_reformation_push.10.title: "The Academy of Geneva and Missionary Work"
 icd_reformation_push.10.desc: "After successfully converting our state, [GetCharacter('john_calvin').GetName] now looks to spread his religion through education and external actions. He plans on structuring an Academy of Geneva, as a seminary focused on educating pastors and civil officials for our state. The expectation is that some of these educated clerics will be directed to perform proselytising missions in [GetCountry('FRA').GetName]."
 icd_reformation_push.10.a: "Sounds like a good idea"
 icd_reformation_push.10.b: "And risk angering the French? No way"
 icd_reformed.10.title: "The Reformer [GetCharacter('icd_caspar_olevian').GetName]"
 icd_reformed.10.desc: "A recent arrival in our lands is [GetCharacter('icd_caspar_olevian').GetName], a [ShowReligionAdjective('calvinist')] theologian who has begun to promote Calvin's teachings over those of [ShowReligionName('lutheran')]. Should we welcome him into our territory and possibly give him a post in a local university, it might signal a significant shift in our population's religious beliefs."
 icd_reformed.10.a: "Welcome him with open arms"
 icd_reformed.10.b: "He has no business here"
 
 icd_conversion_events.2.title: "Islamic Pressure"
 icd_conversion_events.2.desc: "Our [ShowReligionAdjective('tengri')] faith has been challenged by the more coherent organization of [ShowReligionGroupName('muslim')]. Some [ShowReligionAdjective('sunni')] scholars and leaders in our society pressure our state and come to our court consistently, seeking to make our ruler convert and accept this new faith."
 icd_conversion_events.2.a: "Ridiculous!"
 icd_conversion_events.2.b: "These [ShowReligionGroupAdjectiveWithNoTooltip('muslim')]s may have a point"
 icd_conversion_events.3.title: "Buddhist Missionaries"
 icd_conversion_events.3.desc: "Lamas have arrived in our country, passing on teachings of the Buddha and spreading mystical techniques. In our court, they have proven quite influential and many have begun to question our exclusive commitment to our current faith, instead suggesting we should adopt the lamas' [ShowReligionAdjective('tibetan_buddhism')] religion."
 icd_conversion_events.3.a: "Ridiculous!"
 icd_conversion_events.3.b: "These [ShowReligionAdjectiveWithNoTooltip('tibetan_buddhism')]s may have a point"
 icd_conversion_events.3.c: "What do the monks from neighbouring China have to say?"
 
 icd_loss_of_german_territories: "We will lose our [locations|e] in Central Germany that do not have a land connection to our capital."
 
 icd_conversion_events.1000.title: "This"
 icd_conversion_events.1000.desc: "That"
 
 IMERG: "Mergentheim"
 IMERG_ADJ: "Mergentheimer"
 
 icd_conversion_events.4.title: "Conversion of the Sindhi"
 icd_conversion_events.4.entry: "Conversion of the Sindhi"
 icd_conversion_events.4.desc: "The presence of influential Sufi orders in Sindhi society and the gradual collapse of Buddhism as a strong religious institution has led to the increasing shift of Sindhi society away from its Buddhist past and into Islam. Should we uphold this shift, our populace will adopt Muslim values far more quickly than would be otherwise expected."
 icd_conversion_events.4.a: "Uphold Islam!"
 icd_conversion_events.4.b: "And lose a source of jizya tax? Never"
 
 icd_reformation_push.11.title: "Spread of Calvinism"
 icd_reformation_push.11.desc: "[GetCharacter('john_calvin').GetName]'s recent brilliant writings have proven a powerful addition and overhaul of the [ShowReligionAdjective('calvinist')] faith. Whereas once we may have rejected or avoided certain elements of the [ShowReligionName('calvinist')], many in our society are now willing to openly embrace it."
 icd_reformation_push.11.a: "Embrace [ShowReligionName('calvinist')]"
 icd_reformation_push.11.b: "Reject this nonsense"
 icd_bosnian_conversion_tt: "[ShowCultureName('bosnian')] [pops|e] will convert in large numbers to [ShowReligionGroupName('muslim')]."
 
 icd_millenarian_decline_tt: "The Shia religious movement and the Mahdist religious order are destroyed"
 
 icd_muslim_events.2000.title: "Manage our Waqf Distribution"
 icd_muslim_events.2000.desc: "A [waqf|e] is a type of Islamic irrevocable and untaxeable endowment, usually consisting of land and property. Although traditionally, a [waqf|e] has been typically used to support a charitable service or a religious institution, a type of [waqf|e] known as a family waqf has taken shape in the Islamic world, where an aristocratic family is able to secure an estate as untaxeable and irrevocable, allowing it to pass on undisturbed to future generations.\n\nIn-game, these awqaf (waqfs) will be often created in reaction to autocratic or concessionary measures we uphold. They reduce crown power and noble and clergy tax, but slightly boost development growth and religious conversion.\n\nCurrent [waqf_distribution|e]: [Player.MakeScope.ScriptValue('icd_waqf_country')]\nCurrent [waqf_distribution|e] potential gain: [Player.MakeScope.ScriptValue('icd_waqf_change')]"
 icd_muslim_events.2000.b: "Give away waqf concessions"
 icd_muslim_events.2000.c: "Seize awqaf (waqfs) en masse"
 icd_muslim_events.2000.d: "Nevermind"
 icd_muslim_events.1.title: "A Fatwa on Sunni under Non-Muslims"
 icd_muslim_events.1.desc: "The [ShowReligionAdjective('sunni')] people of [ROOT.GetVariable('icd_non_muslim_decree_var').GetCountry.GetName] have been left leaderless and bound to a despicable foreign regime that seeks to force them to abandon their faith. We should get our [ShowEstateTypeName('clergy_estate')] to issue a fatwa regarding how these abandoned [ShowReligionAdjective('sunni')] people should behave towards their heathen rulers."
 icd_muslim_events.1.a: "Urge them towards violent struggle and resistance"
 icd_muslim_events.1.b: "Permit them to conceal their beliefs through taqiyya"
 icd_muslim_events.1.c: "Order them on a hijra, fleeing towards Muslim lands"
 icd_caliphate_our_fatwa_rebellion_tt: "Every [location|e] with 500 or more [ShowReligionAdjective('sunni')] [pops|e] in [ROOT.GetVariable('icd_non_muslim_decree_var').GetCountry.GetName] will gain a negative modifier and will see [ShowReligionAdjective('sunni')] [pops|e] lose [pop_satisfaction|e]."
 icd_caliphate_our_fatwa_taqiyya_tt: "Every [location|e] with 500 or more [ShowReligionAdjective('sunni')] [pops|e] in [ROOT.GetVariable('icd_non_muslim_decree_var').GetCountry.GetName] will gain a negative religious conversion modifier"
 icd_caliphate_our_fatwa_hijra_tt: "Every [location|e] with 500 or more [ShowReligionAdjective('sunni')] [pops|e] in [ROOT.GetVariable('icd_non_muslim_decree_var').GetCountry.GetName] will see some [ShowReligionAdjective('sunni')] [pops|e] flee to a neighbouring [ShowReligionAdjective('sunni')] country."
 icd_muslim_events.2.title: "A Fatwa Calls for Unrest"
 icd_muslim_events.2.desc: "[SCOPE.sCharacter('icd_caliph_ruler').GetName] has arranged for his theologians to issue a fatwa, a Muslim legal ruling, urging our [ShowReligionAdjective('sunni')] population to refuse our religion violently and to revolt and show disobedience towards our state."
 icd_muslim_events.2.a: "Concerning"
 icd_muslim_events.3.a: "Concerning"
 icd_muslim_events.4.a: "Concerning"
 icd_caliphate_fatwa_revolt_tt: "Every [location|e] with 500 or more [ShowReligionAdjective('sunni')] [pops|e] will gain a negative modifier and will see [ShowReligionAdjective('sunni')] [pops|e] lose [pop_satisfaction|e]."
 icd_muslim_events.3.title: "A Fatwa Calls for Dissimilation"
 icd_muslim_events.3.desc: "[SCOPE.sCharacter('icd_caliph_ruler').GetName] has arranged for his theologians to issue a fatwa, a Muslim legal ruling, permitting our [ShowReligionAdjective('sunni')] population to pretend adopting our religion while secretly practicing [ShowReligionGroupName('muslim')]. This will hinder genuine conversion efforts."
 icd_caliphate_fatwa_taqiyya_tt: "Every [location|e] with 500 or more [ShowReligionAdjective('sunni')] [pops|e] will gain a negative religious conversion modifier"
 icd_muslim_events.4.title: "A Fatwa Calls for Flight"
 icd_muslim_events.4.desc: "[SCOPE.sCharacter('icd_caliph_ruler').GetName] has arranged for his theologians to issue a fatwa, a Muslim legal ruling, calling our [ShowReligionAdjective('sunni')] population to flee our country to [SCOPE.sCountry('target_recipient_country').GetName] before they are forced to convert to our religion."
 icd_caliphate_fatwa_hijra_tt: "Every [location|e] with 500 or more [ShowReligionAdjective('sunni')] [pops|e] will see some [ShowReligionAdjective('sunni')] [pops|e] flee to [SCOPE.sCountry('target_recipient_country').GetName]"
 icd_muslim_events.5.title: "An Unsuitable Mutawalli"
 icd_muslim_events.5.desc: "A mutawalli is the caretaker of a [waqf|e], responsible for preserving it and ensuring its intended purpose is fulfilled. A wealthy aristocrat has recently donated a large property as a waqf intended to serve as an orphanage, but kept in his will the appointment of a currently underage mutawalli, incapable of exercising his role.\n\nThe local community wishes to see the waqf respected but some jurists the capacity of this underage mutawalli to honor it."
 icd_muslim_events.5.a: "A Sharia court will appoint a new mutawalli"
 icd_muslim_events.5.b: "Keep the child as mutawalli, assisted by a temporary aide"
 icd_muslim_events.5.c: "Declare the waqf fraudulent and seize it"
 icd_muslim_events.6.title: "A Benevolent Fraud"
 icd_muslim_events.6.desc: "A recent supposed [waqf|e] for a hospital in [SCOPE.sLocation('target_location').GetName] appears to be fraudulent and based on a falsified will endowing state-owned land. Usually, this would invalidate the waqf and see the land return to the state, but the positive impact of a hospital in the area must not be overlooked."
 icd_muslim_events.6.a: "Keep the waqf in place"
 icd_decrease_waqf_five: "Decrease our [waqf_distribution|e] by 5"
 icd_muslim_events.7.title: "Missing Evidence"
 icd_muslim_events.7.desc: "In a recent audit by one of our officials, an incredibly old family [waqf|e] covering an entire neighbourhood in one of our cities has been discovered to lack crucial evidence that would sustain its case.\n\nWe could use this as an opportunity to declare this waqf invalid and seize land, or we could respect its history and importance to the local community."
 icd_muslim_events.7.a: "Seize it"
 icd_muslim_events.7.b: "Leave it alone"
 icd_muslim_events.8.title: "Excessive Endowments"
 icd_muslim_events.8.desc: "[SCOPE.sCharacter('icd_spending_spouse').GetName] has proven to be a problematic member of the imperial harem. Increasingly, she intervenes in administration and freely distributes state-owned land as charitable awqaf/[waqf|e]. However, her activities prove difficult to halt, as her actions have proven quite popular among the [ShowEstateTypeName('clergy_estate')]."
 icd_muslim_events.8.a: "Have her stop"
 icd_muslim_events.8.b: "Let her be"
 icd_muslim_events.9.title: "Kitchens for the Poor"
 icd_muslim_events.9.desc: "A proposal has been raised by one of our government officials, to create a [waqf|e] in [SCOPE.sLocation('target_location').GetName] to sustain and supply as a communal charitable kitchen for the urban poor. This would certainly benefit our people, but it would cost an amount of our crown land."
 icd_muslim_events.9.a: "Establish this waqf!"
 icd_muslim_events.9.b: "Better not"
 icd_muslim_events.10.title: "Rebellious Sufi Leader"
 icd_muslim_events.10.desc: "A Sufi leader has become wildly popular in our country among our [heathen|e] population. His teachings blend Islamic principles with a more syncretic and visual approach to faith that has brought several people closer to [ShowReligionGroupName('muslim')].\n\nHowever, he also is vocally critical of our government and apocalyptic. Some fear he may destabilise our society and harm more than help."
 icd_muslim_events.10.a: "Let the murshid do what they will"
 icd_muslim_events.10.b: "Have him secretly killed"
 icd_muslim_events.11.title: "A Tomb for a Master"
 icd_muslim_events.11.desc: "An incredibly popular Sufi leader has recently died, leaving his disciples distraught and in search for an appropriate place to bury him. Should we choose to sponsor the construction of a tomb for him, we will strengthen the Sufi's devotion."
 icd_muslim_events.11.a: "Build a tomb"
 icd_muslim_events.11.b: "They can figure something out themselves"
 icd_muslim_events.12.title: "Waqf for the Sufi"
 icd_muslim_events.12.desc: "A local Sufi tariqah (lodge) in our country has been struggling to sustain itself financially, becoming overcrowded and decrepit. Though gifts have come from the local populace, the local devotees ideally would require a [waqf|e] dedicated to the maintenance of their institution."
 icd_muslim_events.12.a: "Grant a [waqf|e]
 icd_muslim_events.12.b: "They can figure something out"
 icd_muslim_events.13.title: "Sufism in the Hinterlands"
 icd_muslim_events.13.desc: "A Sufi leader has gained considerable popularity and presence in [SCOPE.sLocation('target_location').GetName], forming a well-funded and very locally influential lodge. Associating with him and recognising his political influence could pay off for us."
 icd_muslim_events.13.a: "Work with him"
 icd_muslim_events.13.b: "He is a threat to us"
 icd_muslim_events.14.title: "Pensions to Murshid"
 icd_muslim_events.14.desc: "Sufi leaders, murshid, are often given pensions by states in recognition of their societal importance. There are a handful of Sufi leaders in our society that would be deserving of this treatment, if we should choose to extend it to them." 
 icd_muslim_events.14.a: "Provide some murshid with pensions"
 icd_muslim_events.14.b: "Grant them [waqf|e] concessions instead"
 icd_muslim_events.14.c: "They can look after themselves"
 icd_muslim_events.15.title: "Accusations of Bid'ah"
 icd_muslim_events.15.desc: "One of our jurists, [SCOPE.sCharacter('target_figure')] has levied accusations of bid'ah against the Sufi orders in our country. He claims that their practices are innovations, not derived from the Sunnah or the Quran, but creations that are haram. He has suggested that our government forbid their presence in a particular location to warn them for their excessive activities."
 icd_muslim_events.15.a: "He is a fool and has no place with us"
 icd_muslim_events.15.b: "Perhaps we coddle the Sufi too much"
 icd_muslim_events.16.title: "A Tariqah Shut Down"
 icd_muslim_events.16.desc: "A Sufi lodge, tariqah, in [SCOPE.sLocation('target_location')] has shut down after intense harassment from elements of the local population who have objected to some of their practices and supposed beliefs as un-Islamic and haram."
 icd_muslim_events.16.a: "They were deviants indeed"
 icd_muslim_events.16.b: "The lodge will stay open, the people should calm down"
 icd_muslim_events.17.title: "Hurufism"
 icd_muslim_events.17.desc: "An influential Sufi leader, [SCOPE.sCharacter('target_character')], has caught attention for his beliefs that God is reflected in the Letters, with God embodied in words and in the 28 letters of the Arabic alphabet, and the 32 letters of the Persian alphabet. His teachings have started a widespread movement, gathering considerable support and skirting the line between [ShowReligionAdjective('sunni')], [ShowReligionAdjective('shia')] and heterodox Sufism. Many have begun to connect his teachings with messianic or apocalyptic movements."
 icd_muslim_events.17.a: "Setup infrastructure for his movement"
 icd_muslim_events.17.b: "Have him imprisoned and executed"
 icd_muslim_events.18.title: "Imadaddin Nasimi"
 icd_muslim_events.18.desc: "A poet, [SCOPE.sCharacter('target_character')], has caught attention for his association with a movement known as 'Hurufism', which sees God's reflection in Letters and words. His skill and poetic ability in Turkish, Persian and Arabic are stunning, such that many even ignore his heterodox Hurufi ideas."
 icd_muslim_events.18.a: "He will make a great addition to our court"
 icd_muslim_events.18.b: "Imprison and then kill him"
 icd_muslim_events.19.title: "Spread of Hurufism"
 icd_muslim_events.19.desc: "A mystical movement, known as Hurufism, has become popularised in our society. It sees God's reflection in letters and words, and has gained a strong connection to millenarian tribal Sufi movements."
 icd_muslim_events.19.a: "Nothing we can do about it"
 icd_muslim_events.19.b: "We must rid ourselves of this movement"
 icd_muslim_events.20.title: "Nuqtavi"
 icd_muslim_events.20.desc: "A Sufi figure by the name of Mahmoud Pasikhani, once part of the Nuqtavi movement, has recently declared himself the Mahdi and united a large number of devotees around his apocalyptic Hurufi messages.\n\nIt is unlikely that this movement will amount to much, but we should keep an eye on it."
 icd_muslim_events.20.a: "Allow them to remain concentrated in a specific place"
 icd_muslim_events.20.b: "Spread them out violently"
 icd_muslim_events.21.title: "A Preacher in the Wetlands"
 icd_muslim_events.21.desc: "A millenarian Sufi movement has been given birth in the Iraqi wetlands and has begun to spread among many of the local communities on the border between Iraqi and Lur territory. It preaches the coming end times, and enshrines its leadership as important in the apocalyptic process."
 icd_muslim_events.21.a: "Allow them to form a cohesive group"
 icd_muslim_events.21.b: "Disperse them violently"
 icd_muslim_events.22.title: "The Musha'sha'"
 icd_muslim_events.22.desc: "What was once a smaller diffuse group, the Musha'sha' now stand as a large messianic Sufi order based primarily in Khuzestan. With a large increase in their Zeal, they have found great adherence from local tribes, and have used their mahdist theology to create a strong military tribal alliance that may threaten our interests."
 icd_muslim_events.22.a: "This is worrisome"
 icd_muslim_events.23.title: "Ascension of the Musha'sha'"
 icd_muslim_events.23.desc: "The Musha'sha' sufi order have become a dominant authority in the regions they are present in, teaching a Shia-influenced messianic version of Islam that promotes their own political and military authority. Led by [SCOPE.sCharacter('icd_mushasha_founder')], they are now defying our own political control and seeking to create a separate dynasty from ours."
 icd_muslim_events.23.a: "We shall fight them in the marshes"
 icd_muslim_events.23.b: "We surrender to them"
 icd_muslim_events.24.title: "The Safavids"
 icd_muslim_events.24.desc: "In recent years, the Safavid Order based in Ardabil has stood out for its popularity and presence among both rural and tribal Turks. Preaching a messianic mission, they connect theological, military and political ideals together. With a large increase in their Zeal, they have found great adherence from local tribes, and have used their mahdist theology to create a strong military tribal alliance that may threaten our interests."
 icd_muslim_events.24.a: "concerning"
 icd_muslim_events.25.title: "Ascension of the Safavids"
 icd_muslim_events.25.desc: "The Safavids have proven incapable of being controlled or made subservient. They become a dominant authority in the regions they are present in, teaching a Shia-influenced messianic version of Islam that promotes their own political and military authority. They are now defying our own political control and seeking to create a separate dynasty from ours."
 icd_muslim_events.25.a: "We shall fight them where we must"
 icd_muslim_events.25.b: "We surrender to them"
 icd_muslim_events.26.title: "The Decline of Mahdism"
 icd_muslim_events.26.desc: "The Sufi-Shiite messianism that had been present in many of our lands for the past century has begun to recently die down due to the changing political and cultural scenario. Tribal Sufi orders are no longer as relevant, and charismatic figures have been replaced by a stronger presence from state autocrats.\n\nThis has led to several Sufi orders being disbanded, and the highly unorthodox form of Shiism associated with some of them to die down."
 icd_muslim_events.26.a: "We can suppose this is good"
 icd_muslim_events.27.title: "Khuruj"
 icd_muslim_events.27.desc: "With the death of our ruler, comes a destabilising period for our state. In Zaydi theology, opposition to an unproven leader is legitimised by the religious concept of khuruj. Taking the example of Zayd ibn Ali and how he legitimised his position as Imam through rebellion, one can see righteous rebellion as justified and a means of proclaiming the correct Imamate.\n\nIf we wish to avoid further political troubles in times of succession in the future, we should seek to clarify further the relationship of succession and political stability."
 icd_muslim_events.27.a: "Unfortunate"
 icd_muslim_events.28.title: "Concealment of the Imamate"
 icd_muslim_events.28.desc: "After suffering a devastating attack, the Imam has disbanded his organization and gone into a period of hiding, concealment - satr. His direct presence in the world will be strongly missed."
 icd_muslim_events.28.a: "Understood"
 icd_muslim_events.29.title: "Aga Khan and the Imamate"
 icd_muslim_events.29.desc: "A new era of modernity, industry and globalization calls for a renewed structure for the Imamate and a more interconnected relationship between the Nizari. Taking the title of Aga Khan, our Imam has promised significant reforms."
 icd_muslim_events.29.a: "Understood"
 icd_muslim_events.30.title: "Preeminence of the Imamate"
 icd_muslim_events.30.desc: "The Nizari community and the Imamate have been propelled politically by the success of its following countries. No longer fearing as much for their safety, and defended by a powerful state, the Nizari enter into a new age."
 icd_muslim_events.31.title: "Revival of the Imamate"
 icd_muslim_events.31.desc: "Though not politically dominant as it was once was, the Nizari Imamate has secured a foothold and the Imam has the freedom to act publically. No powerful state defends its need, but the Nizari community may not need that for now."
 icd_muslim_events.32.title: "Taqiyya of the Imamate"
 icd_muslim_events.32.desc: "The Imamate exists and the Imam is active in leading the Nizari community, but surrounded by hostile religions and states, he must conceal our beliefs according to the practice of taqiyya and pretend to be a Sufi order rather than the true religion. Our people must be stalwart and wary."
 