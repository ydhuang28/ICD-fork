 azeri_culture_movement: "Azerification of Adharis"
 azeri_culture_movement_desc: "The migration of Turks into the Caucasus has caused a gradual transformation of Adhari culture. Adhari people increasingly speak the Turkic Azeri language and adopt Turkic customs. All Adhari pops will gradually become Azeri over time, unless they are ruled by fellow Adharis, Iranians that accept them or do not accept the Azeri culture, or countries that accept Adhari but do not accept Azeri."
 azeri_culture_movement_location_modifier: "Azeri Culture Movement Location Modifier"
 dutch_culture_movement: "Dutch Convergence"
 dutch_culture_movement_desc: "The creation of the Netherlands will lead to the formation of a distinct political culture associated with it. The primary culture of the Netherland's founding states will adopt this new identity first, partly followed by other cultures of the Low Countries. Once the formation of this identity begins, related cultures that sit outside the Netherlands will not adopt the identity so readily."
 dutch_culture_movement_location_modifier: "Dutch Culture Movement Location Modifier"
 lithuanian_culture_movement: "Lithuanian Ethnogenesis"
 lithuanian_culture_movement_desc: "The Duchy of Lithuania has brought unity to the Aukstaitian and Samogitian peoples. A new identity and culture will form among them once the state begins a process of cultural integration."
 lithuanian_culture_movement_location_modifier: "Lithuanian Culture Movement Location Modifier"
 russian_culture_movement: "Russian Ethnogenesis"
 russian_culture_movement_desc: "The unification of the lands of Rus has brought the unification of distinct East Slavic dialects under a larger umbrella of Russian identity. A new identity and culture will form among the East Slavs that are accepted by the Russian state, but will exclude peoples that have not been brought under Russian authority."
 russian_culture_movement_location_modifier: "Russian Culture Movement Location Modifier"
 ruthenian_culture_movement: "Ruthenian Ethnogenesis"
 ruthenian_culture_movement_desc: "The establishment of a united Ruthenia has brought the unification of distinct East Slavic dialects under a larger umbrella of Ruthenian identity. A new identity and culture will form among the East Slavs that are accepted by the Ruthenian state, but will exclude peoples that have not been brought under Ruthenian authority."
 ruthenian_culture_movement_location_modifier: "Ruthenian Culture Movement Location Modifier"
 
 turkification_culture_movement: "Eastern Turco-Mongol Tradition"
 turkification_culture_movement_desc: "The intermixing of Turkish and Mongol culture has led to the formation of a distinct Turco-Mongol identity. Over time, Mongols that are not governed by a Mongol government that can defend their interests, will adopt Turkic languages and a Turkic identity. In Iran and Central Asia, this is often translated as becoming Turkmen" 
 turkification_culture_movement_location_modifier: "Eastern Turco-Mongol Tradition Location Modifier"
 turkification_culture_movement_tt: "The Eastern Turco-Mongol Tradition has not begun."
 
 western_turkification_culture_movement: "Western Turco-Mongol Tradition"
 western_turkification_culture_movement_desc: "The intermixing of Turkish and Mongol culture has led to the formation of a distinct Turco-Mongol identity. Over time, Mongols that are not governed by a Mongol government that can defend their interests, will adopt Turkic languages and a Turkic identity. In the Caucasus and Anatolia, this is often translated as becoming Turkomans"
 western_turkification_culture_movement_tt: ""The Western Turco-Mongol Tradition has not begun."
 western_turkification_culture_movement_location_modifier: "Western Turco-Mongol Tradition Location Modifier"
 
 cossack_culture_movement: "Cossack Acculturation"
 cossack_culture_movement_desc: "The arrival of peasant settlers to the Pontic Steppe does not usually accompany the arrival of a strong state control over the region. A distinct lifestyle built on semi-nomadism and semi-militarization, influenced by the existing lifestyle of the Tatar nomads, has begun to flourish."
 cossack_culture_movement_location_modifier: "Cossack Location Modifier"
 cossack_culture_movement_allow_tt: "The Acculturation of Cossacks has not begun"
 
 azeri_culture_movement_allow_tt: "The Azerification of Adharis into Azeris has not begun."
 lithuanian_culture_movement_allow_tt: "Lithuania exists as the only Lithuanian state and has begun establishing a new culture."
